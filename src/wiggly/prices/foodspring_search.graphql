query allSearchResultQuery(
  $keyword: String!
  $isMobile: Boolean!
  $searchInput: GoodsSearchInput!
  $areaId: ID
) {
  ...SearchResultPCFragment_1gJacW @skip(if: $isMobile)
  ...SearchHeaderPCFragment_1jgNCV @skip(if: $isMobile)
  pcGoodsCount: goodsSearch(first: 80, input: $searchInput, areaId: $areaId) @skip(if: $isMobile) {
    totalCount
  }
  ...SearchResultMobileFragment_1gJacW @include(if: $isMobile)
  ...SearchResultMobileCartFragment_1jgNCV @include(if: $isMobile)
  mobileGoodsCount: goodsSearch(first: 20, input: $searchInput, areaId: $areaId) @include(if: $isMobile) {
    totalCount
  }
}

